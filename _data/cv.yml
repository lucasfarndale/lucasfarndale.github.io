- title: Employment
  type: time_table
  contents:
    - title: Postdoctoral Research Associate
      institution: University of Glasgow / CRUK Scotland Institute (group of Ke Yuan)
      year: 2026-present
      description:
        - "ORCHESTRATE prostate cancer project (led by Hing Leung, Ed Roberts and Ke Yuan)."
        - "Spatial statistics: testing whether reported spatial relationships between cell types in tumours are statistically robust, using CosMx spatial transcriptomics (about 498,000 cells from 89 patients), four published imaging cohorts, and a screen of 215 papers. Designed simulation and calibration pipelines and released a tested, installable software package."
        - "Lymph node immunology: designed and built the computational analysis of CODEX multiplex images of prostate-draining lymph nodes from mouse models (about 1.7 million cells), covering segmentation, vessel morphometry, spatial statistics with density-controlled nulls, QC, and batch assessment."

- title: Education
  type: time_table
  contents:
    - title: PhD Precision Medicine
      institution: CRUK Scotland Institute / University of Glasgow / University of Edinburgh
      year: 2022-2026
      description:
        - "Supervised by Robert Insall, Ke Yuan and Ed Roberts."
        - "Thesis (submitted): Super Vision Without Supervision: Enhancing Biomedical Image Analysis with Self-Supervised Learning."
        - "Applied self-supervised learning to high-content biomedical imaging to discover new prognostic biomarkers, first on H&E slides and later on multiplexed imaging, and developed methods that distil knowledge from advanced modalities into models needing only H&E."
    - title: MSci Mathematics (First Class Honours)
      institution: University of Glasgow
      year: 2016-2022
      description:
        - "5th year project: Learning the Behaviour of Complex Systems with Graph Neural Networks (Prof. Colin Torney)."
        - "4th year project: Effects of Fluid Flow on the Vicsek Model (Prof. Nigel Mottram)."

