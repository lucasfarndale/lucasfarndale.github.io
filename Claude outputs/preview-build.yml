name: preview-build

# Builds the site on any branch except master/main and saves the result as a
# downloadable zip ("site-preview") on the workflow run page. It never deploys.
# You can also start it by hand from the Actions tab (Run workflow).

on:
  push:
    branches-ignore:
      - master
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
